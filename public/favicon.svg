<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- Workforce Team Silhouette (Subtle) -->
  <circle cx="21" cy="22" r="5" fill="rgba(255,255,255,0.4)" />
  <path d="M13 36 C13 30, 29 30, 29 36" fill="rgba(255,255,255,0.3)" />

  <circle cx="43" cy="22" r="5" fill="rgba(255,255,255,0.4)" />
  <path d="M35 36 C35 30, 51 30, 51 36" fill="rgba(255,255,255,0.3)" />

  <circle cx="32" cy="19" r="6" fill="rgba(255,255,255,0.7)" />
  <path d="M22 35 C22 28, 42 28, 42 35" fill="rgba(255,255,255,0.55)" />

  <!-- Pulse / Heartbeat Line Overlay representing PulseHR Activity -->
  <path d="M7 45 L22 45 L26 37 L31 53 L36 33 L40 48 L44 45 L57 45" 
        fill="none" 
        stroke="url(#pulseGrad)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />
</svg>

