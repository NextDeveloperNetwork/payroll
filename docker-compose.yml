version: '3.8'

services:
  # PulseHR Workforce & HR Management App
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulsehr-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3487}:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL
      - JWT_SECRET
      - ENCRYPTION_KEY
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - pulsehr-net

  # Cloudflare Tunnel for secure external HTTPS access
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: pulsehr-cloudflare-tunnel
    restart: unless-stopped
    depends_on:
      - app
    networks:
      - pulsehr-net
    environment:
      - TUNNEL_METRICS=0.0.0.0:2000
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}

networks:
  pulsehr-net:
    driver: bridge
